00% { opacity: 0; } } .feed { animation-name: feedIn; } @keyframes feedIn { 0% { opacity: 0; transform: translateY(-8px); } 4%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } } .gx { transform-origin: left; animation: growX 10s var(--d, 0s) infinite both; } .gy { transform-origin: bottom; animation: growY 10s var(--d, 0s) infinite both; } @keyframes growX { 0% { transform: scaleX(0); } 12%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } } @keyframes growY { 0% { transform: scaleY(0); } 12%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } } .pop { transform-origin: center; animation: pop 10s var(--d, 0s) infinite both; } @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 5%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } } .breath { transform-origin: bottom; animation: breath 4s var(--d, 0s) ease-in-out infinite alternate; } @keyframes breath { from { transform: scaleY(.88); } to { transform: scaleY(1.04); } } .draw { stroke-dasharray: 100; animation: draw 10s infinite both; } @keyframes draw { 0% { stroke-dashoffset: 100; } 60%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } } .gauge { stroke-dasharray: 100; animation: gauge 10s infinite both; } @keyframes gauge { 0% { stroke-dashoffset: 100; } 15% { stroke-dashoffset: 30; } 30% { stroke-dashoffset: 42; } 45%, 90% { stroke-dashoffset: 36; } 100% { stroke-dashoffset: 100; } } .ring { stroke-dasharray: 100; animation: ring 10s infinite both; } .ringdone { stroke-dasharray: 100; animation: ringdone 10s infinite both; } @keyframes ring { 0% { stroke-dashoffset: 100; } 85% { stroke-dashoffset: var(--p); } 100% { stroke-dashoffset: var(--p); } } @keyframes ringdone { 0% { stroke-dashoffset: 100; } 50%, 100% { stroke-dashoffset: 0; } } .wave { animation: wave 2.4s ease-out infinite; transform-origin: center; } .wave.w2 { animation-delay: .8s; } .wave.w3 { animation-delay: 1.6s; } @keyframes wave { from { transform: scale(.9); opacity: .8; } t