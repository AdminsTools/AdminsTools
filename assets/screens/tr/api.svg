<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" class="scr" role="img" aria-label="API istemcisi"><style data-std="">svg{ --bg: #f4f5f7; --surface: #fff; --surface-2: #eceef1; --text: #1d1f20; --muted: #5d5f63; --faint: #9a9ca0; --line: color-mix(in srgb, #1d1f20 12%, transparent); --accent: #5980a6; --accent-2: #3d7bb5; --accent-soft: #dceaf8; --accent-fg: #2c455d; --navy: #1b3352; --ok: #4f9d6b; --ok-bg: #e3f3e8; --ok-fg: #2d6b43; --warn: #d9a441; --warn-bg: #fbf0d9; --warn-fg: #8a6414; --bad: #c4554d; --bad-bg: #f8e1df; --bad-fg: #8c2f28; --mint: #7ee8b4; --cyan: #3fd0e0; --shadow: 0 18px 50px color-mix(in srgb, #1b3352 16%, transparent); --f-body: "Barlow", system-ui, "Segoe UI", sans-serif; --f-head: "Barlow Condensed", "Barlow", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;} @media (prefers-color-scheme: dark) { svg{ --bg: #15171a; --surface: #1e2024; --surface-2: #272a2f; --text: #e4e5e7; --muted: #a3a5a9; --faint: #6f7277; --line: color-mix(in srgb, #e4e5e7 12%, transparent); --accent: #7ea3c8; --accent-soft: #23364a; --accent-fg: #b9d3ec; --ok-bg: #1f3428; --ok-fg: #8fd3a6; --warn-bg: #3a3020; --warn-fg: #e8c27a; --bad-bg: #3b2322; --bad-fg: #f0a29b; --shadow: 0 18px 50px rgba(0, 0, 0, .45);} } svg{background:var(--surface)} .ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round} svg.scr { width: 100%; height: auto; font-family: var(--f-body); } svg .mono { font-family: var(--f-mono); } svg .head { font-family: var(--f-head); } svg .pn { fill: #fff; font-size: 6px; font-weight: 600; text-anchor: middle; } svg .b5 { font-weight: 500; } svg .b6 { font-weight: 600; } svg .b7 { font-weight: 700; } svg .am { text-anchor: middle; } svg .ae { text-anchor: end; } .f-surf, .bx { fill: var(--surface); } .bx { stroke: var(--line); } .ol { fill: none; stroke: var(--faint); } .f-bg { fill: var(--bg); } .f-s2 { fill: var(--surface-2); } .f-none { fill: none; } .f-acc { fill: var(--accent); } .f-btn { fill: #5980a6; } .f-accsoft { fill: var(--accent-soft); } .f-lane { fill: color-mix(in srgb, var(--accent) 6%, var(--surface)); } .f-ok { fill: var(--ok); } .f-bad { fill: var(--bad); } .f-warn { fill: var(--warn); } .f-pur { fill: #8d6cc4; } .f-tea { fill: #3aa6a0; } .f-blu { fill: #4f7fc4; } .f-okbg { fill: color-mix(in srgb, var(--ok) 6%, var(--surface)); } .f-grp { fill: color-mix(in srgb, var(--ok) 7%, transparent); } .s-grp { stroke: color-mix(in srgb, var(--ok) 30%, transparent); } .f-area { fill: color-mix(in srgb, var(--accent) 14%, transparent); } .p-ok { fill: var(--ok-bg); } .p-bad { fill: var(--bad-bg); } .p-warn { fill: var(--warn-bg); } .p-info { fill: var(--accent-soft); } .p-off { fill: var(--surface-2); } .c-r0 { fill: #4f9d6b; } .c-r1 { fill: #b9a23d; } .c-r2 { fill: #d9a441; } .c-r3 { fill: #c4554d; } .s-line { stroke: var(--line); } .s-acc { stroke: var(--accent); } .s-accb { stroke: var(--accent); stroke-width: 1.4; } .s-tm { stroke: var(--faint); } .s-ok { stroke: var(--ok); } .s-bad { stroke: var(--bad); } .s-warn { stroke: var(--warn); } .s-pur { stroke: #8d6cc4; } .s-tea { stroke: #3aa6a0; } .s-blu { stroke: #4f7fc4; } .s-s2 { stroke: var(--surface-2); } .s-tx { stroke: var(--text); } .s-grad { stroke: url(#lg-pulse); } .op2 { fill-opacity: .2; } .tx { fill: var(--text); } .tm { fill: var(--muted); } .tf { fill: var(--faint); } .ta { fill: var(--accent-fg); color: var(--accent); } .tw { fill: #fff; color: #fff; } .tk { fill: #1a1204; } .tok { fill: var(--ok-fg); } .tbad { fill: var(--bad-fg); } .twarn { fill: var(--warn-fg); } use.ta { color: var(--accent); } use.tw { color: #fff; } svg .an, svg .feed, svg .gx, svg .gy, svg .pop, svg .breath, svg .wave { transform-box: fill-box; } .an, .feed { animation: scrIn 10s var(--d, 0s) infinite both; } @keyframes scrIn { 0% { opacity: 0; transform: translateY(5px); } 4%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } } .feed { animation-name: feedIn; } @keyframes feedIn { 0% { opacity: 0; transform: translateY(-8px); } 4%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } } .gx { transform-origin: left; animation: growX 10s var(--d, 0s) infinite both; } .gy { transform-origin: bottom; animation: growY 10s var(--d, 0s) infinite both; } @keyframes growX { 0% { transform: scaleX(0); } 12%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } } @keyframes growY { 0% { transform: scaleY(0); } 12%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } } .pop { transform-origin: center; animation: pop 10s var(--d, 0s) infinite both; } @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 5%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } } .breath { transform-origin: bottom; animation: breath 4s var(--d, 0s) ease-in-out infinite alternate; } @keyframes breath { from { transform: scaleY(.88); } to { transform: scaleY(1.04); } } .draw { stroke-dasharray: 100; animation: draw 10s infinite both; } @keyframes draw { 0% { stroke-dashoffset: 100; } 60%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } } .gauge { stroke-dasharray: 100; animation: gauge 10s infinite both; } @keyframes gauge { 0% { stroke-dashoffset: 100; } 15% { stroke-dashoffset: 30; } 30% { stroke-dashoffset: 42; } 45%, 90% { stroke-dashoffset: 36; } 100% { stroke-dashoffset: 100; } } .ring { stroke-dasharray: 100; animation: ring 10s infinite both; } .ringdone { stroke-dasharray: 100; animation: ringdone 10s infinite both; } @keyframes ring { 0% { stroke-dashoffset: 100; } 85% { stroke-dashoffset: var(--p); } 100% { stroke-dashoffset: var(--p); } } @keyframes ringdone { 0% { stroke-dashoffset: 100; } 50%, 100% { stroke-dashoffset: 0; } } .wave { animation: wave 2.4s ease-out infinite; transform-origin: center; } .wave.w2 { animation-delay: .8s; } .wave.w3 { animation-delay: 1.6s; } @keyframes wave { from { transform: scale(.9); opacity: .8; } to { transform: scale(2); opacity: 0; } } .dash { stroke-dasharray: 4 4; animation: dash 1.2s linear infinite; } @keyframes dash { to { stroke-dashoffset: -16; } } .f-hit { animation: hit 3s infinite; fill: transparent; } @keyframes hit { 0% { fill: color-mix(in srgb, var(--accent) 30%, transparent); } 60%, 100% { fill: transparent; } } .wolok { animation: wolok 10s infinite both; } .wolst { animation: wolst 10s infinite both; } @keyframes wolok { 0%, 55% { opacity: 0; } 60%, 95% { opacity: 1; } 100% { opacity: 0; } } @keyframes wolst { 0%, 55% { opacity: 1; } 60%, 100% { opacity: 0; } } .z55{font-size:5.5px} .z6{font-size:6px} .z65{font-size:6.5px} .z7{font-size:7px} .z75{font-size:7.5px} .z8{font-size:8px} .z85{font-size:8.5px} .z9{font-size:9px} .z10{font-size:10px} .z11{font-size:11px} .z12{font-size:12px} .z13{font-size:13px} .z15{font-size:15px} .z22{font-size:22px} .z26{font-size:26px}</style><defs data-std=""><symbol id="i-braces" viewBox="0 0 24 24"><g class="ico"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></g></symbol></defs><rect x="0" y="0" width="640" height="380" class="f-surf"/><use href="#i-braces" x="12" y="9" width="15" height="15" class="ta"/><text textLength="61" lengthAdjust="spacingAndGlyphs" x="33" y="21" class="tx head z13 b7">API istemcisi</text><rect x="0" y="34" width="130" height="346" class="f-bg"/><rect x="8" y="42" width="114" height="15" class="bx" rx="4"/><text textLength="33.9" lengthAdjust="spacingAndGlyphs" x="16" y="52" class="tx z7">+ Yeni istek</text><rect x="8" y="62" width="56" height="15" class="f-btn" rx="4"/><text textLength="24.2" lengthAdjust="spacingAndGlyphs" x="36" y="72" class="tw z7 b6 am">Kayıtlı 0</text><rect x="66" y="62" width="56" height="15" class="bx" rx="4"/><text textLength="26.4" lengthAdjust="spacingAndGlyphs" x="94" y="72" class="tx z7 am">Geçmiş 1</text><text textLength="89.1" lengthAdjust="spacingAndGlyphs" x="12" y="98" class="tf z65">Kayıtlı istek yok. İsteği