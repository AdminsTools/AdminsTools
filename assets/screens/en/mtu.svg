<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" class="scr" role="img" aria-label="MTU discovery"><style data-std="">svg{ --bg: #f4f5f7; --surface: #fff; --surface-2: #eceef1; --text: #1d1f20; --muted: #5d5f63; --faint: #9a9ca0; --line: color-mix(in srgb, #1d1f20 12%, transparent); --accent: #5980a6; --accent-2: #3d7bb5; --accent-soft: #dceaf8; --accent-fg: #2c455d; --navy: #1b3352; --ok: #4f9d6b; --ok-bg: #e3f3e8; --ok-fg: #2d6b43; --warn: #d9a441; --warn-bg: #fbf0d9; --warn-fg: #8a6414; --bad: #c4554d; --bad-bg: #f8e1df; --bad-fg: #8c2f28; --mint: #7ee8b4; --cyan: #3fd0e0; --shadow: 0 18px 50px color-mix(in srgb, #1b3352 16%, transparent); --f-body: "Barlow", system-ui, "Segoe UI", sans-serif; --f-head: "Barlow Condensed", "Barlow", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;} @media (prefers-color-scheme: dark) { svg{ --bg: #15171a; --surface: #1e2024; --surface-2: #272a2f; --text: #e4e5e7; --muted: #a3a5a9; --faint: #6f7277; --line: color-mix(in srgb, #e4e5e7 12%, transparent); --accent: #7ea3c8; --accent-soft: #23364a; --accent-fg: #b9d3ec; --ok-bg: #1f3428; --ok-fg: #8fd3a6; --warn-bg: #3a3020; --warn-fg: #e8c27a; --bad-bg: #3b2322; --bad-fg: #f0a29b; --shadow: 0 18px 50px rgba(0, 0, 0, .45);} } svg{background:var(--surface)} .ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round} svg.scr { width: 100%; height: auto; font-family: var(--f-body); } svg .mono { font-family: var(--f-mono); } svg .head { font-family: var(--f-head); } svg .pn { fill: #fff; font-size: 6px; font-weight: 600; text-anchor: middle; } svg .b5 { font-weight: 500; } svg .b6 { font-weight: 600; } svg .b7 { font-weight: 700; } svg .am { text-anchor: middle; } svg .ae { text-anchor: end; } .f-surf, .bx { fill: var(--surface); } .bx { stroke: var(--line); } .ol { fill: none; stroke: var(--faint); } .f-bg { fill: var(--bg); } .f-s2 { fill: var(--surface-2); } .f-none { fill: none; } .f-acc { fill: var(-